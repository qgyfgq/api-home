<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜安</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green-1: #f0faf4;
    --green-2: #d6f0e0;
    --green-3: #a8dbb8;
    --green-4: #6bbf8e;
    --green-5: #3d9966;
    --text: #2d5a3d;
    --text-light: #6a9b7e;
    --white: #fffffe;
  }

  body {
    min-height: 100vh;
    background: var(--green-1);
    font-family: 'Quicksand', 'Noto Serif SC', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 48px;
    overflow: hidden;
    position: relative;
  }

  /* 背景装饰 */
  .bg-circles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .bg-circles span {
    position: absolute;
    border-radius: 50%;
    background: var(--green-2);
    opacity: 0.5;
    animation: float 8s ease-in-out infinite;
  }
  .bg-circles span:nth-child(1) { width: 320px; height: 320px; top: -80px; left: -80px; animation-delay: 0s; }
  .bg-circles span:nth-child(2) { width: 200px; height: 200px; bottom: -60px; right: 10%; animation-delay: 2s; background: var(--green-3); opacity: 0.3; }
  .bg-circles span:nth-child(3) { width: 140px; height: 140px; top: 30%; right: -40px; animation-delay: 4s; }
  .bg-circles span:nth-child(4) { width: 80px; height: 80px; bottom: 20%; left: 8%; animation-delay: 1s; background: var(--green-3); opacity: 0.4; }

  @keyframes float {
    0%, 100% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-16px) scale(1.03); }
  }

  /* 小叶子装饰 */
  .leaves {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .leaf {
    position: absolute;
    opacity: 0.18;
    animation: sway 6s ease-in-out infinite;
  }
  .leaf svg { fill: var(--green-4); }
  .leaf:nth-child(1) { top: 12%; left: 5%; animation-delay: 0s; }
  .leaf:nth-child(2) { top: 60%; right: 6%; animation-delay: 1.5s; transform: rotate(45deg); }
  .leaf:nth-child(3) { bottom: 15%; left: 15%; animation-delay: 3s; transform: rotate(-20deg); }
  .leaf:nth-child(4) { top: 25%; right: 18%; animation-delay: 0.8s; transform: rotate(70deg); }

  @keyframes sway {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    33% { transform: rotate(8deg) translateY(-5px); }
    66% { transform: rotate(-5deg) translateY(3px); }
  }

  /* 主卡片 */
  .card {
    position: relative;
    z-index: 1;
    background: rgba(255,255,254,0.82);
    backdrop-filter: blur(20px);
    border-radius: 32px;
    padding: 48px 72px;
    max-width: 620px;
    width: 92%;
    text-align: center;
    box-shadow:
      0 4px 32px rgba(61,153,102,0.10),
      0 1px 0 rgba(255,255,255,0.9) inset;
    border: 1.5px solid rgba(168,219,184,0.5);
    animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(32px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* logo区 */
  .logo-wrap {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, var(--green-3), var(--green-4));
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    box-shadow: 0 8px 24px rgba(107,191,142,0.35);
    animation: logoIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
  }

  @keyframes logoIn {
    from { opacity: 0; transform: scale(0.5) rotate(-20deg); }
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .title {
    font-family: 'Noto Serif SC', serif;
    font-size: 2rem;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.12em;
    margin-bottom: 6px;
    animation: fadeUp 0.7s ease 0.2s both;
  }

  .subtitle {
    font-size: 0.85rem;
    color: var(--text-light);
    letter-spacing: 0.05em;
    margin-bottom: 28px;
    font-weight: 400;
    animation: fadeUp 0.7s ease 0.3s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 分割线 */
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
    animation: fadeUp 0.7s ease 0.35s both;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--green-3), transparent);
  }
  .divider span { font-size: 16px; }

  /* 说明文字 */
  .desc {
    font-size: 0.88rem;
    color: var(--text-light);
    line-height: 1.9;
    margin-bottom: 32px;
    animation: fadeUp 0.7s ease 0.4s both;
  }

  /* 标签组 */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 32px;
    animation: fadeUp 0.7s ease 0.45s both;
  }
  .tag {
    background: var(--green-2);
    color: var(--green-5);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.03em;
    border: 1px solid var(--green-3);
    transition: all 0.2s;
  }
  .tag:hover {
    background: var(--green-3);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(107,191,142,0.25);
  }

  /* 按钮 */
  .btn {
    display: inline-block;
    background: linear-gradient(135deg, var(--green-4), var(--green-5));
    color: white;
    border-radius: 50px;
    padding: 13px 36px;
    font-size: 0.9rem;
    font-weight: 500;
    text-decoration: none;
    letter-spacing: 0.05em;
    box-shadow: 0 6px 20px rgba(61,153,102,0.30);
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    animation: fadeUp 0.7s ease 0.5s both;
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  .btn:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 10px 28px rgba(61,153,102,0.38);
  }
  .btn:active { transform: scale(0.97); }

  /* 底部 */
  .footer {
    margin-top: 24px;
    font-size: 0.75rem;
    color: #b0cfbb;
    animation: fadeUp 0.7s ease 0.55s both;
  }
  .footer a { color: var(--green-4); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  /* 漂浮小点 */
  .dots {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .dot {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green-3);
    opacity: 0;
    animation: twinkle 4s ease-in-out infinite;
  }
  .dot:nth-child(1) { top: 20%; left: 20%; animation-delay: 0s; }
  .dot:nth-child(2) { top: 70%; left: 80%; animation-delay: 1s; }
  .dot:nth-child(3) { top: 40%; left: 60%; animation-delay: 2s; width: 4px; height: 4px; }
  .dot:nth-child(4) { top: 80%; left: 30%; animation-delay: 0.5s; }
  .dot:nth-child(5) { top: 15%; left: 75%; animation-delay: 1.8s; width: 8px; height: 8px; }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 0.6; transform: scale(1); }
  }
</style>
</head>
<body>

<div class="bg-circles">
  <span></span><span></span><span></span><span></span>
</div>

<div class="leaves">
  <div class="leaf"><svg width="40" height="40" viewBox="0 0 40 40"><path d="M20 2 C28 8 38 18 36 30 C30 38 10 38 4 28 C0 18 10 4 20 2Z"/></svg></div>
  <div class="leaf"><svg width="32" height="32" viewBox="0 0 40 40"><path d="M20 2 C28 8 38 18 36 30 C30 38 10 38 4 28 C0 18 10 4 20 2Z"/></svg></div>
  <div class="leaf"><svg width="28" height="28" viewBox="0 0 40 40"><path d="M20 2 C28 8 38 18 36 30 C30 38 10 38 4 28 C0 18 10 4 20 2Z"/></svg></div>
  <div class="leaf"><svg width="24" height="24" viewBox="0 0 40 40"><path d="M20 2 C28 8 38 18 36 30 C30 38 10 38 4 28 C0 18 10 4 20 2Z"/></svg></div>
</div>

<div class="dots">
  <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  <div class="dot"></div><div class="dot"></div>

<div class="card">

  <div class="tags">

  <a class="btn" href="https://linanuyx.ccwu.cc/console">进入控制台</a>

  <div class="footer">

</div>

</body>
</html>
